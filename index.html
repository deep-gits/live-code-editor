<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Collab IDE</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    
    <style>
        body { margin: 0; background: #282a36; color: white; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar (Chat) */
        .chat-section { width: 300px; display: flex; flex-direction: column; background: #1e1f29; border-left: 1px solid #444; }
        .chat-header { padding: 15px; background: #44475a; font-weight: bold; text-align: center; }
        #messages { list-style: none; margin: 0; padding: 10px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        #messages li { background: #6272a4; padding: 8px 12px; border-radius: 12px; max-width: 85%; word-wrap: break-word; font-size: 14px; }
        .chat-input-form { display: flex; padding: 10px; background: #282a36; }
        #chat-input { flex-grow: 1; padding: 8px; border-radius: 4px; border: none; outline: none; }
        #send-btn { margin-left: 5px; padding: 8px 12px; background: #50fa7b; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* Main Area */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; }
        
        /* Toolbar */
        .toolbar { padding: 10px; background: #44475a; display: flex; gap: 10px; align-items: center; }
        select, button { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        select { background: #fff; color: #333; }
        #run-btn { background: #50fa7b; color: #000; } /* Green */
        #download-btn { background: #8be9fd; color: #000; } /* Cyan */
        .room-info { margin-left: auto; color: #f8f8f2; font-size: 14px; opacity: 0.8; }

        /* Editor & Output */
        .editor-container { flex-grow: 1; position: relative; }
        .CodeMirror { height: 100%; font-size: 16px; }
        
        /* Output Console */
        .output-console { height: 150px; background: #000; color: #0f0; padding: 10px; font-family: monospace; overflow-y: auto; border-top: 2px solid #444; display: none; }
        .output-console.active { display: block; }
        .close-console { float: right; cursor: pointer; color: red; font-weight: bold; }

    </style>
</head>
<body>

    <div class="main-content">
        <div class="toolbar">
            <select id="language-select">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
            </select>
            <button id="run-btn">▶ Run Code</button>
            <button id="download-btn">⬇ Download</button>
            <span class="room-info" id="room-display">Room: ...</span>
        </div>
        
        <div class="editor-container">
            <textarea id="code-editor"></textarea>
        </div>

        <div id="output" class="output-console">
            <span class="close-console" onclick="document.getElementById('output').classList.remove('active')">x</span>
            <pre id="output-text">Running...</pre>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-header">💬 Team Chat</div>
        <ul id="messages"></ul>
        <form class="chat-input-form" id="chat-form">
            <input id="chat-input" autocomplete="off" placeholder="Type..." />
            <button id="send-btn">Send</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

    <script>
        const socket = io();

        // 1. Room Logic
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        
        if (!roomId) {
            roomId = Math.random().toString(36).substring(7); // Generate random ID
            window.location.search = `?room=${roomId}`; // Redirect to room
        }
        
        document.getElementById('room-display').innerText = `Room: ${roomId}`;
        socket.emit('join-room', roomId);

        // 2. Editor Setup
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            mode: "javascript", theme: "dracula", lineNumbers: true, autoCloseBrackets: true
        });

        // 3. Language Handling
        const langSelect = document.getElementById('language-select');
        
        // Map simplified names to CodeMirror modes and Judge0 Language IDs
        const langConfig = {
            'javascript': { mode: 'javascript', judge0: 63 },
            'python': { mode: 'python', judge0: 71 },
            'java': { mode: 'text/x-java', judge0: 62 },
            'cpp': { mode: 'text/x-c++src', judge0: 54 }
        };

        langSelect.addEventListener('change', () => {
            const lang = langSelect.value;
            const config = langConfig[lang];
            editor.setOption('mode', config.mode);
            socket.emit('language-change', { roomId, language: lang });
        });

        socket.on('language-update', (lang) => {
            langSelect.value = lang;
            editor.setOption('mode', langConfig[lang].mode);
        });

        // 4. Real-time Code Sync
        editor.on('change', (instance, changes) => {
            if (changes.origin !== 'setValue') {
                socket.emit('code-change', { roomId, code: instance.getValue() });
            }
        });

        socket.on('code-update', (code) => {
            const cursor = editor.getCursor();
            editor.setValue(code);
            editor.setCursor(cursor);
        });

        // 5. Chat Sync
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (chatInput.value) {
                socket.emit('chat-message', { roomId, msg: chatInput.value });
                chatInput.value = '';
            }
        });

        socket.on('chat-message', (data) => {
            const li = document.createElement('li');
            li.textContent = data.msg;
            document.getElementById('messages').appendChild(li);
        });

        // 6. RUN CODE (Judge0 API)
        document.getElementById('run-btn').addEventListener('click', async () => {
            const code = editor.getValue();
            const lang = langSelect.value;
            const config = langConfig[lang];
            const outputBox = document.getElementById('output');
            const outputText = document.getElementById('output-text');

            outputBox.classList.add('active');
            outputText.textContent = "Running code...";

            try {
                const response = await fetch('https://ce.judge0.com/submissions?base64_encoded=false&wait=true', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        source_code: code,
                        language_id: config.judge0
                    })
                });
                const data = await response.json();
                
                if (data.stdout !== null && data.stdout !== undefined) {
                    outputText.textContent = data.stdout || "No Output";
                } else if (data.stderr !== null && data.stderr !== undefined) {
                    outputText.textContent = data.stderr;
                } else if (data.compile_output !== null && data.compile_output !== undefined) {
                    outputText.textContent = data.compile_output;
                } else {
                    outputText.textContent = data.message || data.error || JSON.stringify(data);
                }
            } catch (err) {
                outputText.textContent = "Error: " + err.message;
            }
        });

        // 7. DOWNLOAD CODE
        document.getElementById('download-btn').addEventListener('click', () => {
            const code = editor.getValue();
            const blob = new Blob([code], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `code.${langSelect.value === 'python' ? 'py' : langSelect.value === 'javascript' ? 'js' : 'txt'}`;
            link.click();
        });

    </script>
</body>
</html>
