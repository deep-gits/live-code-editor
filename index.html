<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collab Code + Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    
    <style>
        body { margin: 0; background: #282a36; color: white; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden;}
        
        /* Layout: Editor takes 75%, Chat takes 25% */
        .main-container { display: flex; width: 100%; height: 100%; }
        .editor-section { width: 75%; display: flex; flex-direction: column; border-right: 2px solid #444; }
        .chat-section { width: 25%; display: flex; flex-direction: column; background: #1e1f29; }

        /* Editor Styling */
        h2 { text-align: center; margin: 10px; font-weight: 300; background: #282a36; }
        .CodeMirror { flex-grow: 1; font-size: 16px; }

        /* Chat Styling */
        .chat-header { padding: 15px; background: #44475a; text-align: center; font-weight: bold; }
        #messages { list-style-type: none; margin: 0; padding: 10px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;}
        #messages li { background: #6272a4; padding: 8px 12px; border-radius: 15px; max-width: 80%; word-wrap: break-word; }
        
        /* Chat Input Area */
        .chat-input-form { display: flex; padding: 10px; background: #282a36; }
        #chat-input { flex-grow: 1; padding: 10px; border: none; border-radius: 5px; outline: none; }
        #send-btn { padding: 10px 15px; margin-left: 5px; background: #50fa7b; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="editor-section">
            <h2>⚡ Code Editor</h2>
            <textarea id="code-editor"></textarea>
        </div>

        <div class="chat-section">
            <div class="chat-header">💬 Team Chat</div>
            <ul id="messages"></ul>
            <form class="chat-input-form" id="chat-form">
                <input id="chat-input" autocomplete="off" placeholder="Type a message..." />
                <button id="send-btn">Send</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

    <script>
        const socket = io();

        // --- PART 1: CODE EDITOR LOGIC ---
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            mode: "javascript", theme: "dracula", lineNumbers: true, autoCloseBrackets: true
        });

        // Send code changes
        editor.on('change', (instance, changes) => {
            if (changes.origin !== 'setValue') {
                socket.emit('code-change', instance.getValue());
            }
        });

        // Receive code changes
        socket.on('code-update', (code) => {
            const cursor = editor.getCursor();
            editor.setValue(code);
            editor.setCursor(cursor);
        });

        // --- PART 2: CHAT LOGIC (NEW) ---
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const messages = document.getElementById('messages');

        // Send Message
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Stop page refresh
            if (chatInput.value) {
                // Emit 'chat-message' event to server
                socket.emit('chat-message', chatInput.value);
                chatInput.value = '';
            }
        });

        // Receive Message
        socket.on('chat-message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            // Scroll to bottom
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
